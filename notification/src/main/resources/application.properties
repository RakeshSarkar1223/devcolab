spring.application.name=NOTIFICATION-SERVICE

server.port=8084

# ==============================
# Eureka Client
# ==============================
eureka.client.enabled=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

eureka.instance.prefer-ip-address=true
eureka.instance.ip-address=127.0.0.1
eureka.instance.instance-id=${spring.application.name}:${server.port}


# ==============================
# PostgreSQL Database
# ==============================
spring.datasource.url=jdbc:postgresql://ep-green-haze-a1d0ra4b-pooler.ap-southeast-1.aws.neon.tech/neondb?user=neondb_owner&password=npg_khCdam0qHTw7&sslmode=require&channelBinding=require
spring.datasource.username=neondb_owner
spring.datasource.password=npg_khCdam0qHTw7
spring.datasource.driver-class-name=org.postgresql.Driver

# ==============================
# JPA / Hibernate
# ==============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==============================
# Kafka Consumer
# ==============================
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=notification-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.value.default.type=com.devcolab.notification.event.ProjectInvitationEvent
