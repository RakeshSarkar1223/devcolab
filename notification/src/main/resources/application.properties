spring.application.name=NOTIFICATION-SERVICE

server.port=8084

# ==============================
# Eureka Client
# ==============================
eureka.client.enabled=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

eureka.instance.prefer-ip-address=true
eureka.instance.ip-address=127.0.0.1
eureka.instance.instance-id=${spring.application.name}:${server.port}


# ==============================
# PostgreSQL Database
# ==============================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==============================
# JPA / Hibernate
# ==============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==============================
# Kafka Consumer
# ==============================
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=notification-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.use.type.headers=true
spring.kafka.consumer.properties.spring.json.type.mapping=com.devcolab.projectservice.event.ProjectInvitationEvent:com.devcolab.notification.event.ProjectInvitationEvent,com.devcolab.projectservice.event.InvitationResponseEvent:com.devcolab.notification.event.InvitationResponseEvent,com.devcolab.repo_service.event.PullRequestEvent:com.devcolab.notification.event.PullRequestEvent,com.devcolab.projectservice.event.ProjectDeletedEvent:com.devcolab.notification.event.ProjectDeletedEvent
