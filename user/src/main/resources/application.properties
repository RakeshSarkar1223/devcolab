# ==============================
# Application
# ==============================
spring.application.name=USER-SERVICE
server.port=8082

# ==============================
# Eureka Client
# ==============================
eureka.client.enabled=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

eureka.instance.prefer-ip-address=true
eureka.instance.ip-address=127.0.0.1
eureka.instance.instance-id=${spring.application.name}:${server.port}

# ==============================
# PostgreSQL Database
# ==============================
spring.datasource.url=jdbc:postgresql://ep-green-haze-a1d0ra4b-pooler.ap-southeast-1.aws.neon.tech/neondb?user=neondb_owner&password=npg_khCdam0qHTw7&sslmode=require&channelBinding=require
spring.datasource.username=neondb_owner
spring.datasource.password=npg_khCdam0qHTw7
spring.datasource.driver-class-name=org.postgresql.Driver

# ==============================
# JPA / Hibernate
# ==============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==============================
# Kafka
# ==============================
spring.kafka.bootstrap-servers=localhost:9092

# Producer Configuration
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Consumer Configuration
spring.kafka.consumer.group-id=user-group
spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

# Trust package containing event classes
spring.kafka.consumer.properties.spring.json.trusted.packages=*

# Ignore type headers and always deserialize as UserCreatedEvent
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.value.default.type=com.devcolab.user.event.UserCreatedEvent

# ==============================
# Actuator
# ==============================
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always